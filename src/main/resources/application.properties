spring.application.name=medical-explainer-backend

# ==============================================================================
# Application Server Port
# Render assigns the PORT environment variable dynamically (e.g. 10000).
# Locally it defaults to 8080. Keeps application port separate from DB_PORT.
# ==============================================================================
server.port=${PORT:8080}

# ==============================================================================
# Database Configuration (MySQL 8.4 / Aiven Cloud MySQL)
#
# Environment variables:
#   - DB_HOST     : Database hostname (Aiven: mysql-13f24d04-manthribindusree-fa10.b.aivencloud.com, local: localhost)
#   - DB_PORT     : Database port (Aiven: 25432, local: 3306)
#   - DB_NAME     : Database name (Aiven: defaultdb, local: medical_explainer)
#   - DB_USERNAME : Database username (Aiven: avnadmin, local: root)
#   - DB_PASSWORD : Password read securely from environment variable (never hardcoded)
#   - DB_SSL_MODE : SSL mode (Aiven requires REQUIRED, defaults to REQUIRED)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medical_explainer}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# HikariCP Connection Pool (Optimized for cloud latency and SSL handshakes)
# ==============================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MedicalExplainerHikariPool

# ==============================================================================
# JPA / Hibernate Configuration
# ddl-auto=update safely creates/updates schema without dropping existing tables or data.
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ==============================================================================
# Cross-Origin Resource Sharing (CORS)
# Supports local frontend dev and cloud deployed frontends (Render, Vercel, Netlify)
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://*.onrender.com,https://*.vercel.app,https://*.netlify.app}

# ==============================================================================
# File Upload Configuration
# ==============================================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# ==============================================================================
# Security & JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================================================
# AI Configuration (Optional External API; built-in clinical engine serves as reliable fallback)
# ==============================================================================
ai.api.key=${AI_API_KEY:}
ai.model=gemini-1.5-flash
